name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # Compare pushes to the previous commit on either supported branch.
          # Pull requests use their full changed-file list from the GitHub API.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            integration:
              - '!**/*.md'

  # Unit tests and CLI tests (no Ghidra or JDK installation needed).
  # Doctor success is checked by command_tests in readonly-integration.
  unit-and-cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-unit-and-cli-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Run unit tests
        run: cargo test --lib --bin ghidra-cli --verbose

      - name: Run xtask tests
        run: cargo test -p xtask --verbose

      - name: Check generated command tree
        run: cargo xtask gen-tree --check

      - name: Run CLI tests
        run: cargo test --no-fail-fast --test e2e --test output_format_integration --test routing_tests --test harness_tests --verbose

  # Ghidra setup - installs Ghidra to seed installation caches.
  # This runs once per OS, then test jobs use the cached artifacts.
  # Job-level cancellation lets documentation pushes leave code tests running.
  ghidra-setup:
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-ghidra-setup-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache Ghidra installation and config
        id: ghidra-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/ghidra-cli
            ~/.config/ghidra-cli
            ~/Library/Application Support/ghidra-cli
            ~/Library/Preferences/ghidra-cli
            ~/AppData/Local/ghidra-cli
            ~/AppData/Roaming/ghidra-cli
          # v6 preserves archive times; macOS v7 also caches built native tools.
          key: ghidra-${{ matrix.os }}-${{ runner.os == 'macOS' && 'v7-native' || 'v6' }}

      - name: Build
        run: cargo build --verbose

      - name: Setup Ghidra (skip if cached)
        run: |
          DOCTOR_OUTPUT=$(cargo run -- doctor 2>&1 || true)
          echo "$DOCTOR_OUTPUT"
          if echo "$DOCTOR_OUTPUT" | grep -q "analyzeHeadless: OK"; then
            echo "Ghidra already installed (cache hit), skipping setup"
          else
            echo "Ghidra not found, running setup..."
            cargo run -- setup
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS native Ghidra tools
        if: runner.os == 'macOS'
        run: python3 .github/scripts/build-ghidra-natives.py
        timeout-minutes: 15

  # Read-only integration tests (one bridge).
  readonly-integration:
    needs: [changes, ghidra-setup]
    if: ${{ !cancelled() && needs.changes.outputs.integration == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-readonly-integration-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Restore Ghidra installation and config
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/ghidra-cli
            ~/.config/ghidra-cli
            ~/Library/Application Support/ghidra-cli
            ~/Library/Preferences/ghidra-cli
            ~/AppData/Local/ghidra-cli
            ~/AppData/Roaming/ghidra-cli
          # v6 preserves archive times; macOS v7 also caches built native tools.
          key: ghidra-${{ matrix.os }}-${{ runner.os == 'macOS' && 'v7-native' || 'v6' }}

      - name: Build
        run: cargo build --verbose

      - name: Setup Ghidra (fallback if cache missed)
        run: |
          DOCTOR_OUTPUT=$(cargo run -- doctor 2>&1 || true)
          echo "$DOCTOR_OUTPUT"
          if echo "$DOCTOR_OUTPUT" | grep -q "analyzeHeadless: OK"; then
            echo "Ghidra already installed (cache hit)"
          else
            echo "Cache miss, running setup..."
            cargo run -- setup
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS native Ghidra tools
        if: runner.os == 'macOS'
        run: python3 .github/scripts/build-ghidra-natives.py
        timeout-minutes: 15

      # Initialize the runner-local Ghidra cache before parallel JVM startup.
      - name: Initialize and verify Ghidra runtime
        run: cargo run -- doctor --runtime
        timeout-minutes: 5

      - name: Run read-only integration tests
        run: cargo xtask test --no-fail-fast --test readonly_tests --test memory_tests --test command_tests --verbose -- --nocapture
        timeout-minutes: 80
        env:
          RUST_LOG: info

  # Mutation tests run in parallel with read-only integration tests.
  mutation-integration:
    needs: [changes, ghidra-setup]
    if: ${{ !cancelled() && needs.changes.outputs.integration == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-mutation-integration-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Restore Ghidra installation and config
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/ghidra-cli
            ~/.config/ghidra-cli
            ~/Library/Application Support/ghidra-cli
            ~/Library/Preferences/ghidra-cli
            ~/AppData/Local/ghidra-cli
            ~/AppData/Roaming/ghidra-cli
          # v6 preserves archive times; macOS v7 also caches built native tools.
          key: ghidra-${{ matrix.os }}-${{ runner.os == 'macOS' && 'v7-native' || 'v6' }}

      - name: Build
        run: cargo build --verbose

      - name: Setup Ghidra (fallback if cache missed)
        run: |
          DOCTOR_OUTPUT=$(cargo run -- doctor 2>&1 || true)
          echo "$DOCTOR_OUTPUT"
          if echo "$DOCTOR_OUTPUT" | grep -q "analyzeHeadless: OK"; then
            echo "Ghidra already installed (cache hit)"
          else
            echo "Cache miss, running setup..."
            cargo run -- setup
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS native Ghidra tools
        if: runner.os == 'macOS'
        run: python3 .github/scripts/build-ghidra-natives.py
        timeout-minutes: 15

      # Initialize the runner-local Ghidra cache before parallel JVM startup.
      - name: Initialize and verify Ghidra runtime
        run: cargo run -- doctor --runtime
        timeout-minutes: 5

      - name: Run mutation integration tests
        run: cargo xtask test --no-fail-fast --test address_tests --test comment_tests --test symbol_tests --test patch_tests --test tag_tests --test type_tests --test script_tests --verbose -- --nocapture
        timeout-minutes: 80
        env:
          RUST_LOG: info

  # Infrastructure suites run in two independent jobs per OS.
  infrastructure:
    needs: [changes, ghidra-setup]
    if: ${{ !cancelled() && needs.changes.outputs.integration == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-infrastructure-${{ github.ref }}-${{ matrix.os }}-${{ matrix.suite }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
        suite: [daemon, project]
        include:
          - suite: daemon
            tests: --test daemon_tests
          - suite: project
            tests: --test reliability_tests --test project_tests --test bootstrap_tests --test fixture_tests

    steps:
      - uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Restore Ghidra installation and config
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/ghidra-cli
            ~/.config/ghidra-cli
            ~/Library/Application Support/ghidra-cli
            ~/Library/Preferences/ghidra-cli
            ~/AppData/Local/ghidra-cli
            ~/AppData/Roaming/ghidra-cli
          # v6 preserves archive times; macOS v7 also caches built native tools.
          key: ghidra-${{ matrix.os }}-${{ runner.os == 'macOS' && 'v7-native' || 'v6' }}

      - name: Build
        run: cargo build --verbose

      - name: Setup Ghidra (fallback if cache missed)
        run: |
          DOCTOR_OUTPUT=$(cargo run -- doctor 2>&1 || true)
          echo "$DOCTOR_OUTPUT"
          if echo "$DOCTOR_OUTPUT" | grep -q "analyzeHeadless: OK"; then
            echo "Ghidra already installed (cache hit)"
          else
            echo "Cache miss, running setup..."
            cargo run -- setup
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS native Ghidra tools
        if: runner.os == 'macOS'
        run: python3 .github/scripts/build-ghidra-natives.py
        timeout-minutes: 15

      # Initialize the runner-local Ghidra cache before parallel JVM startup.
      - name: Initialize and verify Ghidra runtime
        run: cargo run -- doctor --runtime
        timeout-minutes: 5

      - name: Run infrastructure tests
        run: cargo xtask test --no-fail-fast ${{ matrix.tests }} --verbose -- --nocapture
        timeout-minutes: 80
        env:
          RUST_LOG: info
