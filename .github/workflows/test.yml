name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      integration: ${{ steps.filter.outputs.integration }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          # Compare pushes to the previous commit on either supported branch.
          # Pull requests use their full changed-file list from the GitHub API.
          base: ${{ github.event_name == 'push' && github.ref || '' }}
          filters: |
            integration:
              - '!**/*.md'

  # Unit tests and CLI tests (no Ghidra or JDK installation needed).
  # Doctor success is checked by command_tests in readonly-integration.
  unit-and-cli:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    concurrency:
      group: ${{ github.workflow }}-unit-and-cli-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Run unit tests
        run: cargo test --locked --lib --bin ghidra-cli --verbose

      - name: Run xtask tests
        run: cargo test --locked -p xtask --verbose

      - name: Check generated command tree
        run: cargo run --locked --quiet --package xtask -- gen-tree --check

      - name: Test CI archive extraction
        run: python -m unittest discover -s .github/actions/install-ghidra -v

      - name: Run CLI tests
        run: cargo test --locked --no-fail-fast --test e2e --test output_format_integration --test routing_tests --test harness_tests --verbose

  # Ghidra setup - installs Ghidra to seed installation caches.
  # This runs once per OS, then test jobs use the cached artifacts.
  # Job-level cancellation lets documentation pushes leave code tests running.
  ghidra-setup:
    needs: changes
    if: ${{ needs.changes.outputs.integration == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-ghidra-setup-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Ghidra
        uses: ./.github/actions/install-ghidra
        timeout-minutes: 20

  # Read-only integration tests (one bridge).
  readonly-integration:
    needs: [changes, ghidra-setup]
    if: ${{ !cancelled() && needs.changes.outputs.integration == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-readonly-integration-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Install Ghidra
        uses: ./.github/actions/install-ghidra
        timeout-minutes: 20

      # Initialize the runner-local Ghidra cache before parallel JVM startup.
      - name: Initialize and verify Ghidra runtime
        run: cargo run --locked -- doctor --runtime
        timeout-minutes: 5

      - name: Run read-only integration tests
        run: cargo run --locked --quiet --package xtask -- test --locked --no-fail-fast --test readonly_tests --test memory_tests --test vtable_tests --test virtual_callers_tests --test address_table_tests --test function_candidates_tests --test data_tests --test export_coverage_tests --test command_tests --verbose -- --nocapture
        timeout-minutes: 80
        env:
          RUST_LOG: info

  # Mutation tests run in parallel with read-only integration tests.
  mutation-integration:
    needs: [changes, ghidra-setup]
    if: ${{ !cancelled() && needs.changes.outputs.integration == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-mutation-integration-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Install Ghidra
        uses: ./.github/actions/install-ghidra
        timeout-minutes: 20

      # Initialize the runner-local Ghidra cache before parallel JVM startup.
      - name: Initialize and verify Ghidra runtime
        run: cargo run --locked -- doctor --runtime
        timeout-minutes: 5

      - name: Run mutation integration tests
        run: cargo run --locked --quiet --package xtask -- test --locked --no-fail-fast --test address_tests --test comment_tests --test symbol_tests --test patch_tests --test tag_tests --test type_tests --test script_tests --test stack_purge_tests --test thunk_tests --test xref_tests --test equate_tests --test bookmark_tests --test namespace_tests --test memory_block_tests --test function_body_tests --test call_signature_tests --test listing_flow_tests --verbose -- --nocapture
        timeout-minutes: 80
        env:
          RUST_LOG: info

  # Infrastructure suites run in two independent jobs per OS.
  infrastructure:
    needs: [changes, ghidra-setup]
    if: ${{ !cancelled() && needs.changes.outputs.integration == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    concurrency:
      group: ${{ github.workflow }}-infrastructure-${{ github.ref }}-${{ matrix.os }}-${{ matrix.suite }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]
        suite: [daemon, project]
        include:
          - suite: daemon
            tests: --test daemon_tests
          - suite: project
            tests: --test reliability_tests --test project_tests --test bootstrap_tests --test fixture_tests

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Install Ghidra
        uses: ./.github/actions/install-ghidra
        timeout-minutes: 20

      # Initialize the runner-local Ghidra cache before parallel JVM startup.
      - name: Initialize and verify Ghidra runtime
        run: cargo run --locked -- doctor --runtime
        timeout-minutes: 5

      - name: Run infrastructure tests
        run: cargo run --locked --quiet --package xtask -- test --locked --no-fail-fast ${{ matrix.tests }} --verbose -- --nocapture
        timeout-minutes: 80
        env:
          RUST_LOG: info

  # Build the official default single JAR and exercise it outside the distribution.
  standalone-jar:
    needs: [changes, ghidra-setup]
    if: ${{ !cancelled() && needs.changes.outputs.integration == 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    concurrency:
      group: ${{ github.workflow }}-standalone-jar-${{ github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install Ghidra
        uses: ./.github/actions/install-ghidra
        timeout-minutes: 20

      - name: Test detached official standalone JAR
        run: cargo test --locked --test standalone_jar_tests --verbose -- --nocapture
        timeout-minutes: 20
        env:
          RUST_LOG: info
