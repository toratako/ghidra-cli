name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Cache Ghidra installation and config
        uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/ghidra-cli
            ~/.config/ghidra-cli
            ~/Library/Application Support/ghidra-cli
            ~/Library/Preferences/ghidra-cli
            ~/AppData/Local/ghidra-cli
            ~/AppData/Roaming/ghidra-cli
          # v6 preserves archive times; macOS v7 also caches built native tools.
          key: ghidra-${{ matrix.os }}-${{ runner.os == 'macOS' && 'v7-native' || 'v6' }}

      - name: Build
        run: cargo build --verbose

      - name: Run xtask tests
        run: cargo test -p xtask --verbose

      - name: Check generated command tree
        run: cargo xtask gen-tree --check

      - name: Setup Ghidra
        run: |
          DOCTOR_OUTPUT=$(cargo run -- doctor 2>&1 || true)
          echo "$DOCTOR_OUTPUT"
          if echo "$DOCTOR_OUTPUT" | grep -q "analyzeHeadless: OK"; then
            echo "Ghidra already installed (cache hit), skipping setup"
          else
            echo "Ghidra not found, running setup..."
            cargo run -- setup
          fi
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build macOS native Ghidra tools
        if: runner.os == 'macOS'
        run: python3 .github/scripts/build-ghidra-natives.py
        timeout-minutes: 15

      # Initialize the runner-local Ghidra cache before parallel JVM startup.
      - name: Initialize and verify Ghidra runtime
        run: cargo run -- doctor --runtime
        timeout-minutes: 5

      - name: Run all tests
        run: cargo xtask test --no-fail-fast --verbose -- --nocapture
        timeout-minutes: 80
        env:
          RUST_LOG: info

  build:
    name: Build ${{ matrix.target }}
    # Gate all release artifacts on the full test suite passing. Because
    # `release` and `publish` both `needs: build`, this transitively blocks the
    # GitHub release and crates.io publish whenever any test job fails.
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            os: macos-26
          - target: aarch64-apple-darwin
            os: macos-26
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ghidra-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ghidra-cli
          cd ../../..

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../ghidra-cli-${{ github.ref_name }}-${{ matrix.target }}.zip ghidra-cli.exe
          cd ../../..

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ghidra-cli-${{ matrix.target }}
          path: ghidra-cli-${{ github.ref_name }}-${{ matrix.target }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Package skills
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          output = Path("artifacts/skills")
          output.mkdir(parents=True, exist_ok=True)
          for manifest in sorted(Path("docs/skills").glob("*/SKILL.md")):
              skill = manifest.parent
              archive = output / f"{skill.name}-{os.environ['GITHUB_REF_NAME']}-skill"
              shutil.make_archive(str(archive), "zip", root_dir=skill.parent, base_dir=skill.name)

      - name: Extract release notes
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)"
          section = re.search(pattern, Path("CHANGELOG.md").read_text(), re.M | re.S)
          if section is None or not section[1].strip():
              raise SystemExit(f"Missing release notes for {version} in CHANGELOG.md")
          Path("release-notes.md").write_text(section[1].strip() + "\n")

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish to crates.io
    # Enable explicitly with this repository variable and CARGO_REGISTRY_TOKEN.
    if: ${{ vars.PUBLISH_CRATES_IO == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish to crates.io
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
