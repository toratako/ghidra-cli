name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  audit:
    uses: ./.github/workflows/audit.yml

  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-26]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        run: cargo build --locked --verbose

      - name: Run xtask tests
        run: cargo test --locked -p xtask --verbose

      - name: Check generated command tree
        run: cargo run --locked --quiet --package xtask -- gen-tree --check

      - name: Test CI archive extraction
        run: python -m unittest discover -s .github/actions/install-ghidra -v

      - name: Test release publication guards
        run: python -m unittest discover -s .github/scripts -v

      - name: Install Ghidra
        uses: ./.github/actions/install-ghidra
        timeout-minutes: 20

      # Initialize the runner-local Ghidra cache before parallel JVM startup.
      - name: Initialize and verify Ghidra runtime
        run: cargo run --locked -- doctor --runtime
        timeout-minutes: 5

      - name: Run all tests
        run: cargo run --locked --quiet --package xtask -- test --locked --no-fail-fast --verbose -- --nocapture
        timeout-minutes: 80
        env:
          RUST_LOG: info

  build:
    name: Build ${{ matrix.target }}
    # Gate all release artifacts on tests and a fresh dependency audit. Because
    # `release` and `publish` both `needs: build`, this transitively blocks the
    # GitHub release and crates.io publish if either gate fails.
    needs: [test, audit]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            archive: tar.gz
            os: ubuntu-latest
          - target: x86_64-apple-darwin
            archive: tar.gz
            os: macos-26
          - target: aarch64-apple-darwin
            archive: tar.gz
            os: macos-26
          - target: x86_64-pc-windows-msvc
            archive: zip
            os: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Create archive (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czvf ../../../ghidra-cli-${{ github.ref_name }}-${{ matrix.target }}.tar.gz ghidra-cli
          cd ../../..

      - name: Create archive (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          cd target/${{ matrix.target }}/release
          7z a ../../../ghidra-cli-${{ github.ref_name }}-${{ matrix.target }}.zip ghidra-cli.exe
          cd ../../..

      # Attest the final archive bytes, before upload-artifact wraps them for transport.
      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ghidra-cli-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ghidra-cli-${{ matrix.target }}
          path: ghidra-cli-${{ github.ref_name }}-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

  release:
    name: Create GitHub Release
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Package skills
        shell: python
        run: |
          import os
          import shutil
          from pathlib import Path

          output = Path("artifacts/skills")
          output.mkdir(parents=True, exist_ok=True)
          for manifest in sorted(Path("docs/skills").glob("*/SKILL.md")):
              skill = manifest.parent
              archive = output / f"{skill.name}-{os.environ['GITHUB_REF_NAME']}-skill"
              shutil.make_archive(str(archive), "zip", root_dir=skill.parent, base_dir=skill.name)

      - name: Attest skill archives
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: artifacts/skills/*-${{ github.ref_name }}-skill.zip

      - name: Extract release notes
        shell: python
        run: |
          import os
          import re
          from pathlib import Path

          version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          pattern = rf"^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## |\Z)"
          section = re.search(pattern, Path("CHANGELOG.md").read_text(), re.M | re.S)
          if section is None or not section[1].strip():
              raise SystemExit(f"Missing release notes for {version} in CHANGELOG.md")
          Path("release-notes.md").write_text(section[1].strip() + "\n")

      - name: Check release is unpublished
        run: python .github/scripts/release.py check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create draft and upload assets
        id: draft
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          body_path: release-notes.md
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/**/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Publishing is the irreversible asset-lock boundary when immutability is enabled.
      - name: Verify assets and publish release
        run: python .github/scripts/release.py publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.draft.outputs.id }}

  publish:
    name: Publish to crates.io
    # Enable explicitly with this repository variable and CARGO_REGISTRY_TOKEN.
    if: ${{ vars.PUBLISH_CRATES_IO == 'true' }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # master
        with:
          toolchain: stable
      - name: Publish to crates.io
        run: cargo publish --locked --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
